<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GINA 2026 asthma learning, bedside tools, patient follow-up and reports. Developed by Dr. Ashraf Ahmed.">
<meta name="author" content="Dr. Ashraf Ahmed">
<meta name="theme-color" content="#1F5FA8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GINA Asthma Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky header + left rail (desktop) / bottom tab bar (phone); content column max 1080px.
   Palette: airway blue as primary, GINA step-orange as accent, Track 1 teal, Track 2 violet; zones green/amber/red. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface2:#EAF0F7; --ink:#14213D; --muted:#5A6A82; --line:#D7E0EB;
  --primary:#1F5FA8; --primary-ink:#FFFFFF; --accent:#E07A2E; --t1:#0C8577; --t2:#6A4CC2;
  --good:#23894F; --good-bg:#E3F4EA; --warn:#B7790F; --warn-bg:#FCF1DA; --bad:#C63A31; --bad-bg:#FBE6E4; --info-bg:#E5EEFA;
  --wm:rgba(20,33,61,.055);
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  --c-blue:#2F6FD6; --c-teal:#0C8F86; --c-violet:#7A4FD0; --c-orange:#E07A2E; --c-pink:#D14C8B; --c-green:#2E9A55;
  --c-red:#D2453B; --c-indigo:#4A57C9; --c-amber:#C98A10; --c-slate:#5A6B84; --c-cyan:#1A93B8; --c-lime:#6E9A1C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1420; --surface:#152032; --surface2:#1C2A40; --ink:#E6EDF7; --muted:#9AAAC2; --line:#2A3A54;
  --primary:#6AA6F0; --primary-ink:#0D1420; --accent:#F29A55; --t1:#3FC2B0; --t2:#A68BF0;
  --good:#5BCB88; --good-bg:#16352A; --warn:#E9B44C; --warn-bg:#3A2E14; --bad:#F07A70; --bad-bg:#3D1C1C; --info-bg:#1B2D48;
  --wm:rgba(230,237,247,.05); --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  --c-blue:#6AA6F0; --c-teal:#3FC2B0; --c-violet:#A68BF0; --c-orange:#F29A55; --c-pink:#F07AB0; --c-green:#5BCB88;
  --c-red:#F07A70; --c-indigo:#8E99F2; --c-amber:#E9B44C; --c-slate:#9AAAC2; --c-cyan:#5CC4E4; --c-lime:#A8CF55;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1420; --surface:#152032; --surface2:#1C2A40; --ink:#E6EDF7; --muted:#9AAAC2; --line:#2A3A54;
  --primary:#6AA6F0; --primary-ink:#0D1420; --accent:#F29A55; --t1:#3FC2B0; --t2:#A68BF0;
  --good:#5BCB88; --good-bg:#16352A; --warn:#E9B44C; --warn-bg:#3A2E14; --bad:#F07A70; --bad-bg:#3D1C1C; --info-bg:#1B2D48;
  --wm:rgba(230,237,247,.05); --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  --c-blue:#6AA6F0; --c-teal:#3FC2B0; --c-violet:#A68BF0; --c-orange:#F29A55; --c-pink:#F07AB0; --c-green:#5BCB88;
  --c-red:#F07A70; --c-indigo:#8E99F2; --c-amber:#E9B44C; --c-slate:#9AAAC2; --c-cyan:#5CC4E4; --c-lime:#A8CF55;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
h4{font-size:1rem;font-weight:700;margin-top:1.1rem;margin-bottom:.35rem}
p{margin:.4rem 0}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}

/* watermark */
#wm{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;align-items:center;justify-items:center}
#wm span{transform:rotate(-28deg);font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--wm);opacity:.75;white-space:nowrap;user-select:none}
@media (max-width:700px){#wm{grid-template-columns:repeat(2,1fr);grid-auto-rows:120px}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.08rem;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap}
.ed-badge{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;color:var(--primary);text-decoration:none;white-space:nowrap}
.search{flex:1;min-width:0;max-width:420px;margin-left:auto;position:relative}
.search input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
@media (max-width:640px){.brand small,.ed-badge{display:none}.search{max-width:none}}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1360px;margin:0 auto;gap:0}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);align-self:start;height:calc(100vh - 60px);overflow:auto;padding:18px 10px 40px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
.rail a:hover{background:var(--surface2)}
.rail a.on{background:var(--surface);box-shadow:var(--shadow);color:var(--primary)}
.rail .sub{font-weight:500;font-size:.88rem;padding:5px 10px 5px 14px;color:var(--muted)}
.rail .sub.on{color:var(--ink);box-shadow:none;background:var(--surface2)}
.rail .grp{margin:14px 10px 4px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mc,var(--primary));flex:none}
main{min-width:0;padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
.tabbar{display:none}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:.72rem;font-weight:700;color:var(--muted);text-decoration:none}
  .tabbar a.on{color:var(--primary)}
}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.new{background:var(--accent);color:#fff}
.ref{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);font-weight:600}
.ref::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--primary);color:var(--primary-ink);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.82rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.chk input{margin-top:4px;flex:none;width:17px;height:17px;accent-color:var(--primary)}
.chk.on{border-color:var(--primary);background:var(--info-bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.callout{border-radius:10px;padding:12px 14px;background:var(--info-bg);border:1px solid var(--line);margin:.8rem 0}
.callout.warn{background:var(--warn-bg);border-color:transparent}
.callout.bad{background:var(--bad-bg);border-color:transparent}
.callout.good{background:var(--good-bg);border-color:transparent}
.formula{font-family:var(--f-mono);font-size:.88rem;background:var(--surface2);border-radius:8px;padding:8px 10px}
.scroll{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:.92rem;margin:.4rem 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.body > table.tbl, .card > table.tbl{display:block;overflow-x:auto;max-width:100%}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2)}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--f-mono)}
.result{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface2)}
.result.good{background:var(--good-bg);border-color:transparent}
.result.warn{background:var(--warn-bg);border-color:transparent}
.result.bad{background:var(--bad-bg);border-color:transparent}
.result .big{font-family:var(--f-display);font-size:1.5rem;font-weight:800;line-height:1.1}
.result.good .big{color:var(--good)}.result.warn .big{color:var(--warn)}.result.bad .big{color:var(--bad)}
ul,ol{padding-left:1.25rem;margin:.4rem 0}
li{margin:.18rem 0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:stretch;margin-bottom:22px}
.hero .lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.hero-card{background:var(--primary);color:var(--primary-ink);border-radius:16px;padding:20px;position:relative;overflow:hidden;min-height:200px}
.hero-card .eyebrow{color:inherit;opacity:.8}
.hero-card h3{font-size:1.25rem;margin:.3rem 0 .6rem}
.hero-card svg.tree{position:absolute;right:-18px;bottom:-14px;width:180px;height:180px;opacity:.18}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.qt{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:96px}
.qt:hover{border-color:var(--primary)}
.qt b{font-family:var(--f-display);font-size:1rem}
.qt span{font-size:.85rem;color:var(--muted)}
.mod{display:flex;gap:12px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative;overflow:hidden}
.mod:hover{border-color:var(--mc)}
.mod .ico{width:42px;height:42px;border-radius:11px;background:color-mix(in srgb,var(--mc) 16%,transparent);color:var(--mc);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
.mod b{font-family:var(--f-display);font-size:1rem;display:block}
.mod span{font-size:.86rem;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--mc,var(--primary));border-radius:99px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px}

/* topic */
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}
.topic-head{border-left:5px solid var(--mc);padding-left:14px;margin-bottom:16px}
.summary{font-size:1.08rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kp li::marker{color:var(--mc)}
.pearls{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:12px;padding:12px 16px}
.widget{border:2px solid color-mix(in srgb,var(--mc,var(--primary)) 35%,var(--line));border-radius:14px;padding:16px;background:var(--surface)}
.widget > .wh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tlist a{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tlist a:hover{border-color:var(--mc)}
.tlist .done{color:var(--good);font-weight:700;font-size:.82rem}

/* steps staircase */
.stairs{display:grid;gap:8px;align-items:end;margin:8px 0}
.stair{border:0;text-align:left;border-radius:10px 10px 4px 4px;padding:10px;background:color-mix(in srgb,var(--sc) 18%,var(--surface));color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;min-width:0;border-top:4px solid var(--sc)}
.stair.on{background:var(--sc);color:#fff}
.stair .sn{font-family:var(--f-display);font-weight:800;font-size:.9rem}
.stair .sl{font-size:.8rem;line-height:1.25}
.reliever-band{border-radius:8px;padding:8px 10px;font-size:.86rem;font-weight:700;background:color-mix(in srgb,var(--sc) 14%,var(--surface));border:1px dashed var(--sc)}
@media (max-width:620px){.stairs{grid-template-columns:1fr!important}.stair{min-height:0!important;border-radius:10px}}

/* flow */
.flow-path{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.flow-path div{font-size:.88rem;padding:6px 10px;border-radius:8px;background:var(--surface2)}
.flow-path b{color:var(--primary)}
.node{border-radius:12px;padding:16px;background:var(--info-bg)}
.node p{font-size:1.05rem;font-weight:600}

/* zones for action plan */
.plan{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.plan .pwm{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:110px;place-items:center;overflow:hidden}
.plan .pwm span{transform:rotate(-24deg);font-family:var(--f-display);font-weight:800;color:var(--wm);font-size:1.3rem;white-space:nowrap}
.zone{padding:14px 16px;border-top:1px solid var(--line);position:relative}
.zone h4{margin:0 0 4px}
.zone.g{border-left:8px solid var(--good)}.zone.y{border-left:8px solid var(--warn)}.zone.r{border-left:8px solid var(--bad)}
.plan-head{padding:14px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.plan-foot{padding:10px 16px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line)}

/* study */
.flash{min-height:220px;border-radius:16px;padding:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;box-shadow:var(--shadow)}
.flash .q{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.flash .a{font-size:1.05rem}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.leitner{display:flex;gap:6px;align-items:flex-end;height:70px}
.leitner div{flex:1;background:var(--surface2);border-radius:6px 6px 2px 2px;position:relative;min-height:6px}
.leitner div i{position:absolute;left:0;right:0;bottom:0;background:var(--primary);border-radius:6px 6px 2px 2px}

/* patients */
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flags .pill{white-space:normal;text-align:left}
.prow > span{min-width:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.prow:hover{border-color:var(--primary)}

/* severe tree */
.stage{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stage summary{cursor:pointer;padding:10px 14px;display:flex;gap:12px;align-items:center;font-weight:700;list-style:none}
.stage summary::-webkit-details-marker{display:none}
.stage .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);flex:none}
.stage.gp .sn{background:var(--good)}.stage.sp .sn{background:var(--primary)}.stage.co .sn{background:var(--accent)}
.stage .sb{padding:0 14px 12px 56px;font-size:.94rem}

.cycle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:.6rem 0}
.cyc{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.cyc b{font-family:var(--f-display);letter-spacing:.06em}
.cyc.a{background:color-mix(in srgb,var(--c-blue) 15%,var(--surface))}
.cyc.b{background:color-mix(in srgb,var(--c-orange) 18%,var(--surface))}
.cyc.c{background:color-mix(in srgb,var(--c-teal) 16%,var(--surface))}
@media (max-width:620px){.cycle{grid-template-columns:1fr}}

.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.archive-banner{background:var(--warn-bg);color:var(--warn);font-weight:700;border-radius:10px;padding:8px 12px;margin-bottom:14px}

/* dashboard + reports */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,124px),1fr));gap:10px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--primary);text-decoration:none;color:var(--ink)}
.kpi:hover{box-shadow:var(--shadow)}
.kpi.good{border-top-color:var(--good)}.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--bad)}
.kn{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.kl{font-weight:700;font-size:.9rem}.ks{font-size:.78rem;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.report-card{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.report-card .pwm{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:120px;place-items:center;overflow:hidden}
.report-card .pwm span{transform:rotate(-24deg);font-family:var(--f-display);font-weight:800;color:var(--wm);font-size:1.3rem;white-space:nowrap}
.report-card .zone h4{margin-top:0}
.diagram{width:100%;min-width:640px;height:auto;display:block}
.seg a{padding:7px 12px;font-weight:700;font-size:.88rem;color:var(--muted);text-decoration:none;display:inline-block}
.seg a.on{background:var(--primary);color:var(--primary-ink)}
.src{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700}
.src.g{background:var(--info-bg);color:var(--primary)}.src.s{background:var(--warn-bg);color:var(--warn)}
.wm-tag{font-family:var(--f-display);font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;opacity:.8}
@media (max-width:640px){.wm-tag{display:none}}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(10,16,28,.55);display:grid;place-items:center;padding:16px}
.modal{max-width:560px;width:100%;background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;z-index:90;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media print{
  .top,.rail,.tabbar,.noprint{display:none!important}
  .shell{display:block}
  main{padding:0}
  #wm span{color:rgba(0,0,0,.07)}
}
</style>

</head>
<body>
<div id="wm" aria-hidden="true"></div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#home" aria-label="GINA Asthma Mastery home">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--primary)"/><path d="M20 7v11M20 18c0 6-8 6-10 14M20 18c0 6 8 6 10 14M14 25c-3 0-5 2-6 4M26 25c3 0 5 2 6 4" stroke="var(--primary-ink)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      <span><b>Asthma Mastery</b><small>Learn · Assess · Manage · Follow-up</small></span>
    </a>
    <a class="ed-badge" id="edBadge" href="#updates">GINA 2026</a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="text" placeholder="Search topics, tools, doses…" aria-label="Search">
    </div>
    <span class="wm-tag" title="Developer">Dr. Ashraf Ahmed</span>
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme" title="Theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main><div class="wrap" id="view"><p class="muted">Loading GINA content…</p></div></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<script src="content/config.js"></script>
<script>
(function(){
"use strict";
/* ================= utilities ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem("gam_"+k); if(v!==null) return JSON.parse(v); }catch(e){} return (k in mem) ? mem[k] : d; },
  set(k, v){ mem[k] = v; try{ localStorage.setItem("gam_"+k, JSON.stringify(v)); }catch(e){} }
};
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d) return "—"; const x = new Date(d+"T00:00:00"); return isNaN(x) ? d : x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); };
const uid = () => "p" + Math.random().toString(36).slice(2,9);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function copyText(txt, el){
  const done = ()=>toast("Copied");
  try{ navigator.clipboard.writeText(txt).then(done, ()=>fallback()); }catch(e){ fallback(); }
  function fallback(){ if(el){ el.focus(); el.select && el.select(); } toast("Select the text and copy it"); }
}
const canPrint = (()=>{ try{ return window.self === window.top; }catch(e){ return false; } })();

/* ================= state ================= */
const CFG = window.GINA.config;
const S = { edId: CFG.activeEdition, E: null };
const AUTHOR = "Dr. Ashraf Ahmed";

function loadScript(src){ return new Promise((res, rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Could not load "+src)); document.head.appendChild(s); }); }
async function loadEdition(id){
  const ed = CFG.editions.find(e=>e.id===id); if(!ed) throw new Error("Unknown edition "+id);
  const have = window.GINA.editions[id] || {};
  for(const f of ed.files){ const part=f.replace(/\.js$/,""); if(!have[part]) await loadScript(ed.folder+"/"+f); }
  return window.GINA.editions[id];
}
function mergeConsultant(E){
  const C=E.consultant; if(!C||E._merged) return E;
  const mods=E.meta.modules.concat(C.modules.filter(m=>!E.meta.modules.some(x=>x.id===m.id)));
  E.meta.modules = C.order.map(id=>mods.find(m=>m.id===id)).filter(Boolean).concat(mods.filter(m=>!C.order.includes(m.id)));
  C.topics.forEach(t=>{ if(!E.topics.some(x=>x.id===t.id)) E.topics.push(t); });
  if(C.learning){ ["flashcards","mcqs"].forEach(k=>C.learning[k].forEach(x=>{ if(!E.learning[k].some(y=>y.id===x.id)) E.learning[k].push(x); })); }
  E._merged=true; return E;
}
const edInfo = id => CFG.editions.find(e=>e.id===id);
const isArchive = () => S.edId !== CFG.activeEdition;

/* ================= watermark ================= */
(function(){ const w=$("#wm"); let h=""; for(let i=0;i<48;i++) h+=`<span>${AUTHOR}</span>`; w.innerHTML=h; })();

/* ================= theme ================= */
(function(){
  const t = store.get("theme", null); if(t) document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").addEventListener("click", ()=>{
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
    const nx = cur==="dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nx); store.set("theme", nx);
  });
})();

/* ================= icons ================= */
const ICON = {
  home:'<path d="M3 11 12 4l9 7v9H5v-9"/>', learn:'<path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-5a3 3 0 0 0-3 3v12"/>',
  tools:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2"/>',
  patients:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14.6c2 .7 3 2.6 3 5.4"/>',
  study:'<path d="M12 3 2 8l10 5 10-5z"/><path d="M6 10.5V16c2 2 10 2 12 0v-5.5"/>', updates:'<path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/>'
};
const ic = (n,s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ================= tools catalogue ================= */
const TOOLS = [
  { id:"control", w:"controltool", name:"Control & risk", d:"GINA symptom control + risk factor checklist", m:"assessment" },
  { id:"steps", w:"stepfinder", name:"Step finder", d:"Initial treatment and current step by age and track", m:"management" },
  { id:"bdr", w:"bdrcalc", name:"Bronchodilator response", d:"FEV1 / PEF change against GINA criteria", m:"diagnosis" },
  { id:"pef", w:"pefvar", name:"PEF variability", d:"Twice-daily diurnal variability over 1–2 weeks", m:"diagnosis" },
  { id:"ics", w:"icsdose", name:"ICS dose checker", d:"Low / medium / high by drug and age", m:"management" },
  { id:"mart", w:"martdoses", name:"AIR / MART doses", d:"ICS-formoterol dosing by age and step", m:"management" },
  { id:"scores", w:"scoretool", name:"ACT / ACQ", d:"Interpret numerical control scores", m:"assessment" },
  { id:"severity", w:"severity6", name:"Exacerbation grader", d:"Severity + treatment, primary care or ED (≥6 y)", m:"exacerbations" },
  { id:"pram", w:"pram", name:"PRAM score", d:"Paediatric acute severity, 2–17 years", m:"exacerbations" },
  { id:"ocs", w:"ocscalc", name:"Steroid & magnesium doses", d:"Weight-based OCS, dexamethasone, magnesium", m:"exacerbations" },
  { id:"plan", w:"actionplan", name:"Action plan generator", d:"Written asthma action plan by regimen", m:"exacerbations" },
  { id:"t2", w:"t2check", name:"Type 2 phenotype", d:"Is severe asthma Type 2-high?", m:"severe" },
  { id:"bio", w:"biologics", name:"Biologic checker", d:"Eligibility pattern and predictors by class", m:"severe" },
  { id:"copd", w:"copdsyndrome", name:"Asthma vs COPD", d:"Syndromic approach to initial treatment", m:"copd" },
  { id:"psdx", w:"psdx", name:"Preschool diagnosis", d:"Three-criterion check, ≤5 years", m:"preschool" },
  { id:"dx", w:"dxflow", name:"Diagnostic flowchart", d:"Step through Box 1-1", m:"diagnosis" },
  { id:"initial", w:"initialassess", name:"Initial consultation", d:"History, triggers, risk → summary report", m:"assessment" },
  { id:"spiro", w:"spirointerp", name:"Spirometry interpreter", d:"Ratio, BDR (GINA vs ERS/ATS), persistent limitation", m:"diagnosis" },
  { id:"pheno", w:"phenotype", name:"Phenotype assessment", d:"Type 2-high vs low, clinical phenotypes", m:"pathophys" },
  { id:"ddx", w:"ddxexplorer", name:"Differential explorer", d:"16 differentials: clues, tests, how they differ", m:"diagnosis" },
  { id:"inv", w:"invexplorer", name:"Investigations guide", d:"Indications, findings, effect on management", m:"investigations" },
  { id:"device", w:"devicepicker", name:"Device selector", d:"Match inhaler to age, flow, coordination", m:"devices" },
  { id:"tech", w:"techcheck", name:"Technique checklist", d:"Step-by-step check for 6 device types", m:"devices" },
  { id:"severecl", w:"severechecklist", name:"Severe asthma checklist", d:"Structured clinic checklist with summary", m:"severe" },
  { id:"biomono", w:"biomono", name:"Biologic monographs", d:"Mechanism, dosing, safety, evidence for 7 biologics", m:"biologics" },
  { id:"bioresp", w:"bioresponse", name:"Biologic response", d:"Baseline vs now: continue, extend or switch", m:"biologics" },
  { id:"addons", w:"addons", name:"Add-on treatments", d:"LAMA, LTRA, azithromycin, OCS, thermoplasty, emerging", m:"addons" },
  { id:"ocsx", w:"ocsexposure", name:"OCS exposure", d:"Cumulative grams, converter, monitoring actions", m:"ocs" },
  { id:"vent", w:"ventilation", name:"Ventilation helper", d:"PBW tidal volume, auto-PEEP, permissive hypercapnia", m:"exacerbations" },
  { id:"comorb", w:"comorbid", name:"Comorbidity guide", d:"Effect on asthma, assessment, management", m:"special" }
];

/* ================= navigation ================= */
function nav(){
  const r = location.hash.slice(1) || "home";
  const top = r.startsWith("m-")||r.startsWith("t-")||r==="learn" ? "learn"
    : r.startsWith("tool")? "tools" : (r.startsWith("p")||r.startsWith("r-")) ? "patients" : r.startsWith("study") ? "study" : r==="updates"||r==="search" ? r : "home";
  const items = [["home","Dashboard"],["learn","Learn"],["tools","Tools"],["patients","Patients"],["study","Study"]];
  $("#tabbar").innerHTML = items.map(([k,l])=>`<a href="#${k}" class="${top===k?"on":""}">${ic(k)}<span>${l}</span></a>`).join("");
  const mods = S.E.meta.modules;
  const curMod = r.startsWith("m-") ? r.slice(2) : r.startsWith("t-") ? (S.E.topics.find(t=>t.id===r.slice(2))||{}).module : null;
  $("#rail").innerHTML =
    items.map(([k,l])=>`<a href="#${k}" class="${top===k&&!curMod?"on":""}">${ic(k,18)}${l}</a>`).join("") +
    `<a href="#updates" class="${top==="updates"?"on":""}">${ic("updates",18)}Update Centre</a>` +
    `<div class="grp">Modules</div>` +
    mods.map(m=>`<a href="#m-${m.id}" class="sub ${curMod===m.id?"on":""}" style="--mc:var(--c-${m.color})"><span class="dot"></span>${esc(m.title)}</a>`).join("");
}

/* ================= progress ================= */
const prog = {
  studied(){ return store.get("studied_"+S.edId, {}); },
  mark(id, v){ const s=this.studied(); if(v) s[id]=today(); else delete s[id]; store.set("studied_"+S.edId, s); },
  modulePct(mid){ const ts=S.E.topics.filter(t=>t.module===mid); if(!ts.length) return 0; const s=this.studied(); return Math.round(100*ts.filter(t=>s[t.id]).length/ts.length); }
};

/* ================= views ================= */
const V = {};
function shell(html){ return (isArchive()?`<div class="archive-banner">Archive: viewing ${esc(edInfo(S.edId).label)} (read-only). <a href="#updates">Return to current edition</a></div>`:"") + html + footer(); }
function footer(){
  return `<div class="foot"><span>Developed by <b>${AUTHOR}</b> — Based on ${esc(edInfo(S.edId).label)} (${esc(edInfo(S.edId).released)})</span>
  <span>Educational and decision-support tool. It does not replace clinical judgement or the official GINA report.</span></div>`;
}
const modOf = id => S.E.meta.modules.find(m=>m.id===id) || {color:"blue",title:id};

V.home = () => {
  const E=S.E, mods=E.meta.modules, wn=E.whatsnew.items;
  const quick = ["control","steps","severity","plan","ics","bio"].map(id=>TOOLS.find(t=>t.id===id));
  const studied = Object.keys(prog.studied()).length;
  return shell(`
  <section class="hero">
    <div class="stack" style="gap:10px">
      <span class="eyebrow">${esc(edInfo(S.edId).label)} · ${esc(E.meta.released)}</span>
      <h1>Asthma care from first wheeze to biologics</h1>
      <p class="lead">Study the GINA strategy, apply it at the bedside with calculators and algorithms, and follow your patients over time.</p>
      <div class="row"><a class="btn" href="#learn">Start learning</a><a class="btn ghost" href="#tools">Open tools</a><a class="btn ghost" href="#patients">Follow-up</a></div>
    </div>
    <a class="hero-card" href="#updates" style="text-decoration:none">
      <span class="eyebrow">What's new in ${esc(S.edId)}</span>
      <h3>${wn.length} changes since GINA ${esc(E.whatsnew.previous)}</h3>
      <ul style="margin:0;padding-left:1.1rem;font-size:.92rem">${wn.slice(0,4).map(w=>`<li>${esc(w.title)}</li>`).join("")}</ul>
      <svg class="tree" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M50 5v30M50 35c0 15-22 15-28 40M50 35c0 15 22 15 28 40M32 55c-8 0-14 6-18 12M68 55c8 0 14 6 18 12M22 75c-4 4-6 10-6 16M78 75c4 4 6 10 6 16"/></svg>
    </a>
  </section>
  <div class="section-h"><h2>Bedside tools</h2><a href="#tools">All ${TOOLS.length} tools →</a></div>
  <div class="grid g3">${quick.map(t=>`<a class="qt" href="#tool-${t.id}" style="--mc:var(--c-${modOf(t.m).color})"><span class="dot"></span><b>${esc(t.name)}</b><span>${esc(t.d)}</span></a>`).join("")}</div>
  <div class="section-h"><h2>Modules</h2><span class="muted">${studied} of ${E.topics.length} topics studied</span></div>
  <div class="grid g2">${mods.map(moduleCard).join("")}</div>`);
};
function moduleCard(m){
  const n = S.E.topics.filter(t=>t.module===m.id).length, pct = prog.modulePct(m.id);
  return `<a class="mod" href="#m-${m.id}" style="--mc:var(--c-${m.color})"><span class="ico">${esc(m.short.slice(0,2))}</span>
  <span style="flex:1;min-width:0"><b>${esc(m.title)}</b><span>${esc(m.blurb)}</span><div class="bar"><i style="width:${pct}%"></i></div><span style="font-size:.76rem">${n} topics · ${pct}% studied</span></span></a>`;
}
V.learn = () => shell(`<h1>Learn</h1><p class="muted">Each topic runs Summary → Key points → Algorithm or table → Pearls &amp; pitfalls, with the GINA box and page.</p>
  <div class="grid g2" style="margin-top:16px">${S.E.meta.modules.map(moduleCard).join("")}</div>`);

V.module = id => {
  const m = modOf(id), ts = S.E.topics.filter(t=>t.module===id), s = prog.studied();
  const tools = TOOLS.filter(t=>t.m===id);
  return shell(`<div style="--mc:var(--c-${m.color})">
  <div class="crumbs"><a href="#learn">Learn</a>›<span>${esc(m.title)}</span></div>
  <div class="topic-head"><h1>${esc(m.title)}</h1><p class="muted">${esc(m.blurb)}</p></div>
  <div class="stack tlist">${ts.map((t,i)=>`<a href="#t-${t.id}"><span><span class="eyebrow">Topic ${i+1}</span><br><b>${esc(t.title)}</b><br><span class="ref">${esc(t.ref)}</span></span>${s[t.id]?`<span class="done">✓ Studied</span>`:`<span class="muted">›</span>`}</a>`).join("")}</div>
  ${tools.length?`<div class="section-h"><h3>Related tools</h3></div><div class="grid g3">${tools.map(t=>`<a class="qt" href="#tool-${t.id}"><b>${esc(t.name)}</b><span>${esc(t.d)}</span></a>`).join("")}</div>`:""}
  <div class="row" style="margin-top:18px"><a class="btn ghost" href="#study-quiz-${id}">Quiz this module</a><a class="btn ghost" href="#study-flash-${id}">Flashcards</a></div>
  </div>`);
};

V.topic = id => {
  const t = S.E.topics.find(x=>x.id===id); if(!t) return shell(`<p>Topic not found.</p>`);
  const m = modOf(t.module), list = S.E.topics.filter(x=>x.module===t.module), i = list.indexOf(t);
  const prev = list[i-1], next = list[i+1], done = !!prog.studied()[t.id];
  return shell(`<article style="--mc:var(--c-${m.color})">
  <div class="crumbs"><a href="#learn">Learn</a>›<a href="#m-${m.id}">${esc(m.title)}</a></div>
  <div class="topic-head"><h1>${esc(t.title)}</h1><div class="row" style="margin-top:6px">${(t.source||"GINA 2026")==="Supplementary"?`<span class="src s">Supplementary source</span>`:/\+/.test(t.source||"")?`<span class="src g">GINA 2026</span><span class="src s">+ supplementary</span>`:`<span class="src g">GINA 2026</span>`}<span class="ref">${esc(t.ref)}</span></div></div>
  <div class="stack">
    <div><div class="eyebrow">Summary</div><div class="summary">${esc(t.summary)}</div></div>
    ${t.keyPoints&&t.keyPoints.length?`<div><div class="eyebrow">Key points</div><ul class="kp">${t.keyPoints.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`:""}
    ${t.widget?`<div><div class="eyebrow">Algorithm / tool</div><div class="widget" data-w="${t.widget}"></div></div>`:""}
    ${t.body?`<div class="body">${t.body}</div>`:""}
    ${t.pearls&&t.pearls.length?`<div class="pearls"><div class="eyebrow">Pearls &amp; pitfalls</div><ul>${t.pearls.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
    <div class="row sp noprint">
      <button class="btn ${done?"ghost":""}" id="markBtn">${done?"✓ Studied — undo":"Mark as studied"}</button>
      ${canPrint?`<button class="btn ghost" onclick="window.print()">Print</button>`:""}
    </div>
    <div class="row sp noprint">${prev?`<a class="btn ghost sm" href="#t-${prev.id}">‹ ${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="btn ghost sm" href="#t-${next.id}">${esc(next.title)} ›</a>`:""}</div>
  </div></article>`);
};

V.tools = () => shell(`<h1>Tools</h1><p class="muted">Calculators and interactive algorithms. Every result shows its GINA source.</p>
  <div class="grid g3" style="margin-top:16px">${TOOLS.map(t=>`<a class="qt" href="#tool-${t.id}" style="--mc:var(--c-${modOf(t.m).color})"><span class="dot"></span><b>${esc(t.name)}</b><span>${esc(t.d)}</span></a>`).join("")}</div>`);
V.tool = id => {

/* ================= search ================= */
let SEARCH_IDX = null;
function buildIndex(){
  const strip = h => String(h||"").replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ");
  SEARCH_IDX = S.E.topics.map(t=>({type:"topic", id:t.id, title:t.title, sub:modOf(t.module).title, text:[t.title,t.summary,(t.keyPoints||[]).join(" "),strip(t.body),(t.pearls||[]).join(" "),t.ref].join(" ").toLowerCase()}))
    .concat(TOOLS.map(t=>({type:"tool", id:t.id, title:t.name, sub:"Tool", text:(t.name+" "+t.d).toLowerCase()})));
}
V.search = () => {
  const q = ($("#q").value||"").trim().toLowerCase();
  if(!SEARCH_IDX) buildIndex();
  if(q.length<2) return shell(`<h1>Search</h1><p class="muted">Type at least two letters.</p>`);
  const terms = q.split(/\s+/);
  const hits = SEARCH_IDX.map(r=>{ let sc=0; for(const w of terms){ if(!r.text.includes(w)) return null; sc += r.title.toLowerCase().includes(w)?5:1; } return {r,sc}; }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,40);
  const snip = r => { if(r.type!=="topic") return ""; const t=r.text, i=t.indexOf(terms[0]); return esc(t.slice(Math.max(0,i-60), i+110)); };
  return shell(`<h1>Search</h1><p class="muted">${hits.length} result${hits.length===1?"":"s"} for “${esc(q)}”</p>
  <div class="stack tlist" style="margin-top:12px">${hits.map(({r})=>`<a href="#${r.type==="topic"?"t-":"tool-"}${r.id}"><span><span class="eyebrow">${esc(r.sub)}</span><br><b>${esc(r.title)}</b><br><span class="muted" style="font-size:.86rem">…${snip(r)}…</span></span><span class="muted">›</span></a>`).join("") || `<p>No matches. Try a drug name, a box number (e.g. “box 4-8”) or a test.</p>`}</div>`);
};

W.dxflow = el => {
  const N = {
    start:{q:"Patient with chronic or recurrent respiratory symptoms. Are the symptoms, history and examination typical of asthma?", yes:"avail", no:"alt"},
    alt:{q:"Take further history and test for alternative diagnoses (Box 1-3). Is an alternative diagnosis confirmed?", yes:"E_alt", no:"avail"},
    avail:{q:"Is spirometry or PEF available?", yes:"test", no:"bio"},
    test:{q:"Perform spirometry or PEF before and after bronchodilator (criteria in Box 1-2). Is variable expiratory airflow confirmed?", yes:"E_treat", no:"repeat"},
    repeat:{q:"Repeat during symptoms, or consider additional tests (PEF variability, bronchial provocation, response to 4 weeks of ICS). Is variable airflow confirmed now?", yes:"E_treat", no:"bio"},
    bio:{info:"Consider biomarkers: with typical symptoms, FeNO >50 ppb (adults) or >35 ppb (children), or blood eosinophils above the local range, support Type 2 asthma. Lower levels do not rule it out. If other diagnoses are unlikely, treat empirically with ICS-containing treatment (Box 4-4, 4-10).", next:"review", label:"Empirical ICS started"},
    review:{q:"Review response in 1–3 months, including PEF or spirometry if available. Have symptoms (and lung function) improved?", yes:"E_treat", no:"E_refer"},
    E_treat:{end:"Treat for asthma with ICS-containing treatment (adults/adolescents Box 4-4; children 6–11 Box 4-10). Record the evidence for the diagnosis.", tone:"good"},
    E_alt:{end:"Treat the alternative diagnosis. It may still coexist with asthma.", tone:""},
    E_refer:{end:"Refer for higher-level advice.", tone:"bad"}
  };
  let path=[], cur="start";
  function draw(){
    const n=N[cur];
    el.innerHTML = `<div class="wh"><h3>Diagnostic flowchart</h3><button class="btn ghost sm" data-a="reset">Restart</button></div>
    ${path.length?`<div class="flow-path">${path.map(p=>`<div>${esc(N[p.id].q||N[p.id].info).slice(0,95)}… <b>${p.ans}</b></div>`).join("")}</div>`:""}
    ${n.end?`<div class="result ${n.tone}"><div class="big">${n.tone==="good"?"Asthma confirmed":n.tone==="bad"?"Refer":"Alternative diagnosis"}</div><p>${esc(n.end)}</p></div>`
     : n.info?`<div class="node"><p>${esc(n.info)}</p><button class="btn" data-a="next">${esc(n.label)} →</button></div>`
     : `<div class="node"><p>${esc(n.q)}</p><div class="row"><button class="btn" data-a="yes">Yes</button><button class="btn ghost" data-a="no">No</button></div></div>`}
    <p class="muted" style="font-size:.86rem;margin-top:10px">Severely uncontrolled symptoms or signs: treat as exacerbation (Box 9-4). Already taking ICS: use Box 1-4 and 1-5.</p>${refLine("Box 1-1 p.27")}`;
  }
  el.addEventListener("click", e=>{ const a=e.target.closest("[data-a]"); if(!a) return; const n=N[cur];
    if(a.dataset.a==="reset"){ path=[]; cur="start"; }
    else if(a.dataset.a==="next"){ path.push({id:cur,ans:"→"}); cur=n.next; }
    else { path.push({id:cur,ans:a.dataset.a==="yes"?"Yes":"No"}); cur=n[a.dataset.a]; }
    draw(); });
  draw();
};

W.bdrcalc = el => {
  let age="adult", mode="fev1";
  el.innerHTML = `<div class="wh"><h3>Bronchodilator responsiveness</h3><div class="row">${seg("age",[["adult","Adult ≥18"],["child","Child 6–17"]],age)}${seg("mode",[["fev1","Spirometry"],["pef","PEF only"]],mode)}</div></div>

    <div class="field"><label for="b_pre">Pre-BD <span data-u>FEV1 (L)</span></label><input id="b_pre" type="number" step="0.01" value="2.60"></div>
    <div class="field"><label for="b_post">Post-BD <span data-u>FEV1 (L)</span></label><input id="b_post" type="number" step="0.01" value="3.02"></div>
    <div class="field" data-pred><label for="b_pred">Predicted FEV1 (L)</label><input id="b_pred" type="number" step="0.01" value="3.40"></div>
  </div><p class="muted" style="font-size:.84rem">Example values shown. Measure 10–15 min after 200–400 mcg salbutamol. Withhold SABA ≥4 h, formoterol/salmeterol 24 h, indacaterol/vilanterol 36 h, LAMA 36–48 h.</p>
  <div id="b_out" style="margin-top:10px"></div>${refLine("Box 1-2 p.28; p.32")}`;

    const pre=num($("#b_pre",el).value), post=num($("#b_post",el).value), pred=num($("#b_pred",el).value);

    el.querySelector("[data-pred]").hidden = mode==="pef";
    const out=$("#b_out",el);

    const d=post-pre, pct=100*d/pre;
    let pos, conf="", lines=[];
    if(mode==="pef"){ const th = age==="adult"?20:15; pos = pct>=th; lines.push(`PEF change <b class="num">${d.toFixed(0)} L/min (${pct.toFixed(1)}%)</b>; threshold ≥${th}%`); }
    else if(age==="adult"){ const ml=d*1000; pos = pct>=12 && ml>=200; conf = (pct>=15&&ml>=400)?" — greater diagnostic confidence (≥15% and ≥400 mL)":"";
      lines.push(`Change <b class="num">${ml.toFixed(0)} mL</b>, <b class="num">${pct.toFixed(1)}%</b> of baseline (needs ≥12% AND ≥200 mL)`);
      if(pred) lines.push(`For comparison, 2022 ERS/ATS criterion: ${(100*d/pred).toFixed(1)}% of predicted (>10%). GINA 2026 does <b>not</b> use this for diagnosis.`); }
    else { if(!pred){ out.innerHTML=`<div class="result">Enter predicted FEV1 for children.</div>`; return; } const pp=100*d/pred; pos=pp>=12; lines.push(`Change <b class="num">${(d*1000).toFixed(0)} mL</b> = <b class="num">${pp.toFixed(1)}%</b> of predicted (needs ≥12% predicted)`); }
    out.innerHTML = `<div class="result ${pos?"good":"warn"}"><div class="big">${pos?"Positive":"Not positive"}${esc(conf)}</div>${lines.map(l=>`<p>${l}</p>`).join("")}
    <p class="muted">${pos?"Consistent with variable expiratory airflow in a patient with typical symptoms.":"Does not exclude asthma: repeat during symptoms or after withholding bronchodilators, or use other tests (PEF variability, provocation, ICS trial). BDR can be lost during viral infections or severe exacerbations."}</p></div>`;
  };
  bindSeg(el,"age",v=>{age=v;calc();}); bindSeg(el,"mode",v=>{mode=v; if(v==="pef"){$("#b_pre",el).value=380;$("#b_post",el).value=450;}else{$("#b_pre",el).value=2.60;$("#b_post",el).value=3.02;} calc();});
  el.addEventListener("input",calc); calc();
};

/* ---- Control & risk ---- */
W.controltool = el => {
  const D=S.E.data.riskFactors; let age="6";
  const Q = a => a==="6" ? ["Daytime asthma symptoms more than twice a week?","Any night waking due to asthma?","SABA reliever for symptoms more than twice a week? (not ICS-formoterol; not pre-exercise)","Any activity limitation due to asthma?"]
    : ["Daytime asthma symptoms more than twice a week?","Any night waking or night coughing due to asthma?","SABA reliever needed more than twice a week? (not pre-exercise)","Any activity limitation (runs/plays less, tires easily)?"];
  function draw(){
    const rf = age==="6"?D.exacerbation:D.preschool;
    el.innerHTML = `<div class="wh"><h3>Symptom control (past 4 weeks) and risk</h3>${seg("age",[["6","Age ≥6"],["5","Age ≤5"]],age)}</div>
    <div class="stack" style="gap:8px">${Q(age).map((q,i)=>`<label class="chk"><input type="checkbox" data-q="${i}"><span>${esc(q)}</span></label>`).join("")}</div>
    <h4>Risk factors for exacerbations ${age==="6"?"(independent of symptoms)":""}</h4>
    <div class="grid g2" style="gap:8px">${rf.map(r=>`<label class="chk"><input type="checkbox" data-rf="${r.id}"><span>${esc(r.label)}${r.high?` <span class="pill bad">high</span>`:""}</span></label>`).join("")}</div>
    <div id="ct_out" style="margin-top:14px"></div>${refLine(age==="6"?"Box 2-2 p.41; Box 3-5 p.61":"Box 11-1 p.204")}`;
    bindSeg(el,"age",v=>{age=v;draw();});
    calc();
  }
  function calc(){
    $$(".chk",el).forEach(c=>c.classList.toggle("on",c.querySelector("input").checked));
    const n=$$("[data-q]:checked",el).length, rfs=$$("[data-rf]:checked",el).map(x=>x.dataset.rf);
    const lvl = n===0?["Well controlled","good"]:n<=2?["Partly controlled","warn"]:["Uncontrolled","bad"];
    const rf = (age==="6"?D.exacerbation:D.preschool).filter(r=>rfs.includes(r.id));
    const acts=[];
    if(age==="6"){
      if(rf.length||n>0) acts.push("Ensure ICS-containing treatment; switch to an anti-inflammatory reliever (ICS-formoterol or ICS-SABA) if available.");
      if(rf.length) acts.push("Give/update a written action plan; review more often; check technique and adherence.");
      if(rfs.includes("sev1")) acts.push("≥1 severe exacerbation: if no modifiable factors, consider LAMA with medium-dose ICS-LABA, higher ICS if Type 2 high, or specialist referral.");
      if(rfs.includes("fev60")) acts.push("Low FEV1: check adherence/technique, consider 3-month high-dose ICS trial, exclude COPD, refer if no improvement.");
      if(rfs.includes("smoke")) acts.push("Smoking/vaping: cessation support for patient and family.");
      if(rfs.includes("food")) acts.push("Food allergy: avoidance, anaphylaxis plan, epinephrine (IM or intranasal), refer.");
      if(rfs.includes("obesity")) acts.push("Obesity: weight reduction plan; distinguish deconditioning or OSA from asthma.");
      if(rfs.includes("saba12")||rfs.includes("saba")) acts.push("SABA over-use: move to Track 1 (ICS-formoterol reliever) where possible.");
      if(rfs.includes("icu")) acts.push("Previous ICU/intubation: red flag for fatal asthma — flag in notes, early urgent care advice.");
      if(n>0) acts.push("Before stepping up: confirm symptoms are asthma, check technique, adherence, exposures and comorbidities.");
    } else {
      if(n>0||rf.length) acts.push("Before stepping up: check alternative diagnosis, inhaler/spacer technique, adherence and exposures (Box 11-1).");
      if(rfs.includes("sev")||n>0) acts.push("Uncontrolled symptoms or ≥1 severe episode: daily low-dose ICS (Step 2) is the preferred controller.");
    }
    if(!acts.length) acts.push("Continue current treatment; consider stepping down if control has been maintained for 3 months.");
    $("#ct_out",el).innerHTML = `<div class="grid g2">
      <div class="result ${lvl[1]}"><div class="eyebrow">Symptom control</div><div class="big">${lvl[0]}</div><p>${n} of 4 criteria present</p></div>
      <div class="result ${rf.some(r=>r.high)?"bad":rf.length?"warn":"good"}"><div class="eyebrow">Exacerbation risk factors</div><div class="big">${rf.length} present</div><p>${rf.length?esc(rf.map(r=>r.label).join("; ")):"None selected"}</p></div></div>
      <h4>Suggested actions</h4><ul>${acts.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
      <p class="muted" style="font-size:.86rem">Symptom control and risk are reported separately on purpose: they have different causes and treatments.</p>`;
  }
  el.addEventListener("change",calc); draw();
};

/* ---- ICS dose checker ---- */
function icsCategory(r, dose){
  if(r.deviceDependent) return ["Depends on DPI device — see product information",""];
  if(r.lowMedMax!=null && r.lowMax==null){
    if(r.highNA && dose>r.lowMedMax) return ["High dose not applicable for this age","bad"];
    if(r.highAbove!=null) return dose>r.highAbove?["High","bad"]:dose>=(r.lowMedMin||0)?["Low–medium (single range)","good"]:["Below listed range","" ];
    if(dose<=r.lowMedMax) return ["Low–medium (GINA gives one value)","good"];
    return dose>=r.highFrom?["High","bad"]:["Between listed values","warn"];
  }
  if(dose<r.lowMin) return ["Below low-dose range",""];
  if(dose<=r.lowMax) return ["Low","good"];
  if(dose<=r.medMax) return ["Medium","warn"];
  return ["High","bad"];
}
const icsRange = r => r.deviceDependent?["Device-dependent","",""] : r.lowMax!=null?[`${r.lowMin}–${r.lowMax}`,`>${r.lowMax}–${r.medMax}`,`>${r.medMax}`] : r.highAbove!=null?[`${r.lowMedMin}–${r.lowMedMax} (low–medium)`,"",`>${r.highAbove}`] : [`${r.lowMedMax} (low–medium)`,"",r.highNA?"n.a.":`${r.highFrom}`];

    ${age==="pre"?`<div class="scroll"><table class="tbl"><thead><tr><th>ICS</th><th>Low total daily dose (mcg)</th></tr></thead><tbody>${D.preschool.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div><p class="muted">In children, pMDI should always be used with a spacer.</p>${refLine(D.preschool.ref)}`:`
    <div class="fgrid"><div class="field" style="grid-column:span 2"><label for="i_drug">Inhaled corticosteroid</label><select id="i_drug">${rows.map(r=>`<option value="${r.id}">${esc(r.drug)}</option>`).join("")}</select></div>

    ${rows.map(r=>{const g=icsRange(r);return `<tr><td>${esc(r.drug)}</td><td class="num">${g[0]}</td><td class="num">${g[1]}</td><td class="num">${g[2]}</td></tr>`;}).join("")}</tbody></table></div>
    <div class="callout warn">Not a table of equivalence. Switching between “medium” doses of different ICS can change potency. Combination inhalers with LAMA may differ.</div>${refLine(D.ref)}`}`;
    bindSeg(el,"age",v=>{age=v;draw();});
    if(age!=="pre"){ const calc=()=>{ const r=rows.find(x=>x.id===$("#i_drug",el).value), d=num($("#i_dose",el).value); const o=$("#i_out",el); if(d==null){o.innerHTML="";return;} const [c,t]=icsCategory(r,d); o.innerHTML=`<div class="result ${t}"><div class="big">${esc(c)}</div><p class="num">${d} mcg/day · ${esc(r.drug)}</p></div>`; };

function lineChart(vs, key, opts){

  if(pts.length<1) return `<p class="muted">No ${esc(opts.title)} data yet.</p>`;
  const ymin=opts.min, ymax=opts.max, x=i=> pts.length===1?(pl+(W_-pl-pr)/2):pl+i*(W_-pl-pr)/(pts.length-1), y=v=>pt+(H-pt-pb)*(1-(v-ymin)/(ymax-ymin));
  const ticks=opts.ticks; const path=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join("");
  const area = pts.length>1?`${path}L${x(pts.length-1)},${y(ymin)}L${x(0)},${y(ymin)}Z`:"";
  return `<svg class="chart" viewBox="0 0 ${W_} ${H}" role="img" aria-label="${esc(opts.title)} over visits">
   ${ticks.map(t=>`<line class="gl" x1="${pl}" x2="${W_-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}${opts.unit||""}</text>`).join("")}

   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.y)}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?opts.color:"var(--surface)"}" stroke="${opts.color}" stroke-width="2"><title>${esc(fmtDate(p.d))}: ${p.y}</title></circle>`).join("")}
   ${pts.map((p,i)=>(pts.length<=6||i===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(new Date(p.d+"T00:00:00").toLocaleDateString(undefined,{month:"short",year:"2-digit"}))}</text>`:"").join("")}
  </svg>`;
}

    ] }; };
const sortV = p => [...p.visits].sort((a,b)=>a.date.localeCompare(b.date));
P.ocsSeries = p => { const vs=sortV(p), per=+p.ocsCourseMg||200; let cum=0; return vs.map((v,i)=>{ const prev=vs[i-1]; const days=prev?Math.max(0,(new Date(v.date)-new Date(prev.date))/864e5):0; cum += (+v.ocs||0)*per + (prev?(+prev.maintOcs||0)*days:0); return {date:v.date, cum:Math.round(cum)/1000}; }); };
P.within12 = (p, key) => { const y=new Date(); y.setFullYear(y.getFullYear()-1); const ys=y.toISOString().slice(0,10); return sortV(p).filter(v=>v.date>=ys).reduce((s,v)=>s+(+v[key]||0),0); };
const _flags = P.flags;
P.flags = p => { const f=_flags(p); const vs=sortV(p), last=vs[vs.length-1]; if(!last) return f;
  if(+last.maintOcs>0) f.push(["Maintenance OCS "+last.maintOcs+" mg/day","bad"]);
  if(p.biologic&&p.biologic.name){ const m=(new Date()-new Date(p.biologic.start))/(864e5*30.4); f.push([`${p.biologic.name} · ${m<4?"response review due at 4 months":"review response"}`, m<4?"":"warn"]); }
  if(last.act!=null&&last.act!==""&&+last.act<20) f.push(["ACT "+last.act,"warn"]);
  if(+last.icu>0) f.push(["ICU admission","bad"]);
  return f; };
P.score = p => P.flags(p).reduce((s,f)=>s+(f[1]==="bad"?3:f[1]==="warn"?1:0),0);
P.status = p => { const vs=sortV(p), last=vs[vs.length-1]; return last?P.level(last):["No visits","",0]; };

function barChart(items, opts){ // items: [{label, value, color?, title?}]
  const W_=520,H=180,pl=30,pr=10,pt=14,pb=34, max=Math.max(1,...items.map(i=>i.value)), bw=(W_-pl-pr)/items.length;
  const y=v=>pt+(H-pt-pb)*(1-v/max), ticks=[0,Math.ceil(max/2),max].filter((v,i,a)=>a.indexOf(v)===i);
  return `<svg class="chart" viewBox="0 0 ${W_} ${H}" role="img" aria-label="${esc(opts.title)}">
  ${ticks.map(t=>`<line class="gl" x1="${pl}" x2="${W_-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("")}
  ${items.map((it,i)=>{ const x=pl+i*bw+bw*0.2, w=bw*0.6, h=Math.max(0,H-pb-y(it.value)); return `<g><rect x="${x}" y="${y(it.value)}" width="${w}" height="${h}" rx="4" fill="${it.color||opts.color}"><title>${esc(it.label)}: ${it.value}</title></rect>
   <text x="${x+w/2}" y="${y(it.value)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${it.value}</text><text x="${x+w/2}" y="${H-14}" text-anchor="middle">${esc(it.label)}</text></g>`; }).join("")}</svg>`;
}

function visitForm2(p){

const REPORTS=[["initial","Initial consultation"],["routine","Routine follow-up"],["postexac","Post-exacerbation"],["severe","Severe asthma clinic"],["bioresp","Biologic response"],["ocs","OCS reduction"],["step","Step-up / step-down"],["schedule","Follow-up schedule"]];
function stepAdvice(p){
  const vs=sortV(p), l=vs[vs.length-1]; if(!l) return ["","No visits recorded."];
  const L=P.level(l), ex12=P.within12(p,"exac"), st=+l.step||0;
  if(L[1]!=="good"||+l.exac>0){
    if(l.tech==="errors"||(l.adh&&l.adh!=="good")) return ["warn",`Not well controlled, but ${l.tech==="errors"?"inhaler technique errors":""}${l.tech==="errors"&&l.adh!=="good"?" and ":""}${l.adh!=="good"?"adherence problems":""} found. Correct these first, review triggers and comorbidities, then reassess in 4–6 weeks before stepping up.`];
    if(st>=5) return ["bad","Uncontrolled at Step 5: refer/continue severe asthma pathway; phenotype; consider biologic or switch class; minimise OCS."];
    return ["bad",`Consider step-up to Step ${st+1} as a 2–3 month therapeutic trial (after confirming diagnosis, technique, adherence and exposures). For Track 1 use MART at the new dose. Return to the previous step if no response.`];
  }
  const firstGood=(()=>{let k=vs.length-1; while(k>=0&&P.level(vs[k])[1]==="good"&&!(+vs[k].exac)) k--; return vs[k+1];})();
  const months = firstGood?(new Date(l.date)-new Date(firstGood.date))/(864e5*30.4):0;
  if(months>=2.8){ if(+l.maintOcs>0) return ["good","Controlled ≥3 months on maintenance OCS: taper OCS first (2.5–5 mg every 2–4 weeks; morning cortisol near 5 mg/day)."];
    return ["good",`Controlled for ~${months.toFixed(0)} months: consider stepping down (reduce ICS by 25–50%) at a suitable time with a written action plan${ex12?" — under close supervision because of an exacerbation in the last 12 months":""}. Do not stop ICS.`]; }
  return ["",`Controlled at Step ${st}; continue and reassess. Step-down can be considered after 3 months of good control.`];
}
function scheduleAdvice(p){
  const vs=sortV(p), l=vs[vs.length-1]||{}, out=[];
  if(l.type==="postexac"||+l.exac>0) out.push(["Within 2–7 days after an ED visit/admission (1–2 weeks after a self-managed flare)","Post-exacerbation review"]);
  if(p.biologic&&p.biologic.name){ const m=(new Date()-new Date(p.biologic.start))/(864e5*30.4); out.push([m<4?"At 3–4 months after starting (6 months for depemokimab)":"Every 3–6 months","Biologic response review"]); }
  if(+l.maintOcs>0) out.push(["Every 2–4 weeks during OCS taper","OCS reduction"]);
  out.push([P.level(l)[1]==="good"?"Every 3–12 months while stable":"1–3 months after any treatment change","Asthma review"]);
  out.push(["Every 1–2 years (more often if at risk); 3–6 months after starting ICS","Spirometry"]);
  if(p.age!=="adult") out.push(["At least yearly","Height (growth)"]);
  out.push(["At every visit","Technique, adherence, action plan"]);
  return out;
}

    if(i>=set.length){ const pct=Math.round(100*right/set.length);
      const log=store.get("quizlog_"+S.edId,{right:0,total:0}); log.right+=right; log.total+=set.length; store.set("quizlog_"+S.edId,log);
      if(filter!=="all"&&filter!=="new"){ const qm=store.get("quizmod_"+S.edId,{}); qm[filter]=Math.max(qm[filter]||0,pct); store.set("quizmod_"+S.edId,qm); }
      el.innerHTML=`<h1>Quiz complete</h1><div class="result ${pct>=80?"good":pct>=60?"warn":"bad"}" style="margin-top:12px"><div class="big num">${right} / ${set.length} · ${pct}%</div><p>${esc(title)}</p></div><div class="row" style="margin-top:12px"><button class="btn" data-a="again">New round</button><a class="btn ghost" href="#study">Back to Study</a></div>`; return; }
    const q=set[i];
    el.innerHTML=`<div class="row sp"><h1>Quiz</h1><span class="pill">${esc(title)}</span></div><div class="bar" style="margin:10px 0 16px"><i style="width:${100*i/set.length}%"></i></div>
    <div class="card"><div class="row sp"><span class="eyebrow">Question ${i+1} of ${set.length}</span>${q.tag?`<span class="pill new">NEW</span>`:""}</div><p style="font-size:1.08rem;font-weight:600;margin:8px 0">${esc(q.q)}</p>
    ${q.o.map((o,k)=>`<button class="opt ${ans!==null?(k===q.a?"right":k===ans?"wrong":""):""}" data-k="${k}" ${ans!==null?"disabled":""}>${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join("")}
    ${ans!==null?`<div class="callout ${ans===q.a?"good":"bad"}"><b>${ans===q.a?"Correct.":"Not quite."}</b> ${esc(q.e)}<br><span class="ref">${esc(q.ref)}</span></div><button class="btn" data-a="next">${i+1<set.length?"Next question":"See score"}</button>`:""}</div>`;
  };
  el.onclick=e=>{ const o=e.target.closest("[data-k]"), a=e.target.closest("[data-a]");
    if(o&&ans===null){ ans=+o.dataset.k; if(ans===set[i].a) right++; draw(); }
    else if(a&&a.dataset.a==="next"){ i++; ans=null; draw(); }
    else if(a&&a.dataset.a==="again"){ runQuiz(filter); } };
  draw();
}
V.cases = () => shell(`<div class="crumbs"><a href="#study">Study</a>›<span>Cases</span></div><h1>Clinical cases</h1><div class="grid g3" style="margin-top:14px">${L().cases.map(c=>`<a class="qt" href="#study-case-${c.id}"><b>${esc(c.title)}</b><span>${esc(c.tag)} · ${c.steps.length} steps</span></a>`).join("")}</div>`);
V.casePage = id => shell(`<div class="crumbs"><a href="#study">Study</a>›<a href="#study-cases">Cases</a></div><div id="cs"></div>`);
function runCase(id){
  const c=L().cases.find(x=>x.id===id), el=$("#cs"); if(!c){ el.innerHTML="<p>Case not found.</p>"; return; }
  let i=0, ans=null, hist=[];
  const draw=()=>{
    el.innerHTML=`<h1>${esc(c.title)}</h1><p class="muted">${esc(c.tag)}</p>
    <div class="stack" style="margin-top:12px">${hist.map(h=>`<div class="card" style="opacity:.8"><p>${esc(h.text)}</p><p><b>${esc(h.o[h.a])}</b> — ${esc(h.e)}</p></div>`).join("")}
    ${i<c.steps.length?(()=>{const s=c.steps[i];return `<div class="card"><span class="eyebrow">Step ${i+1} of ${c.steps.length}</span><p style="font-weight:600;font-size:1.05rem">${esc(s.text)}</p>
      ${s.o.map((o,k)=>`<button class="opt ${ans!==null?(k===s.a?"right":k===ans?"wrong":""):""}" data-k="${k}" ${ans!==null?"disabled":""}>${esc(o)}</button>`).join("")}
      ${ans!==null?`<div class="callout ${ans===s.a?"good":"bad"}">${esc(s.e)}</div><button class="btn" data-a="next">Continue</button>`:""}</div>`;})()
    :`<div class="result good"><div class="big">Case complete</div></div><div class="row"><a class="btn ghost" href="#study-cases">More cases</a></div>`}</div>`;
  };
  el.onclick=e=>{ const o=e.target.closest("[data-k]"), a=e.target.closest("[data-a]"); if(o&&ans===null){ ans=+o.dataset.k; draw(); } else if(a){ hist.push(c.steps[i]); i++; ans=null; draw(); } };
  draw();
}

function diffEditions(A, B){ // B newer
  const out={added:[],removed:[],changed:[],data:[]};
  const ta=new Map(A.topics.map(t=>[t.id,t])), tb=new Map(B.topics.map(t=>[t.id,t]));
  tb.forEach((t,id)=>{ if(!ta.has(id)) out.added.push(t.title); else if(JSON.stringify(ta.get(id))!==JSON.stringify(t)) out.changed.push(t.title); });
  ta.forEach((t,id)=>{ if(!tb.has(id)) out.removed.push(t.title); });
  Object.keys(B.data).forEach(k=>{ if(JSON.stringify(A.data[k])!==JSON.stringify(B.data[k])) out.data.push(k); });
  return out;
}

  return shell(`<h1>Update Centre</h1>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="eyebrow">Active edition</div><h2 style="margin:4px 0">${esc(act.label)}</h2><p class="muted">${esc(act.source)} · released ${esc(act.released)}</p>
    <p style="font-size:.9rem">Content lives in <span class="mono">${esc(act.folder)}/</span>. Pages refer to the printed page numbers of the report.</p></div>
    <div class="card"><div class="eyebrow">Editions available</div><div class="stack" style="gap:8px;margin-top:8px">${CFG.editions.map(e=>`<div class="row sp"><span><b>${esc(e.label)}</b> <span class="muted">${esc(e.released)}</span></span>${e.id===S.edId?`<span class="pill good">Viewing</span>`:`<button class="btn ghost sm" data-ed="${e.id}">${e.id===CFG.activeEdition?"Return to current":"View (archive)"}</button>`}</div>`).join("")}</div>
    <p class="muted" style="font-size:.86rem;margin-top:10px">Older editions open read-only. Patients and study progress are kept separately.</p></div>
  </div>
  <div class="section-h"><h2>What's new in ${esc(E.meta.edition)}</h2><span class="ref">${esc(wn.ref)}</span></div>
  <div class="stack">${Object.entries(byArea).map(([a,items])=>`<div class="card"><div class="eyebrow">${esc(a)}</div><ul class="kp" style="--mc:var(--accent)">${items.map(w=>`<li><b>${esc(w.title)}.</b> ${esc(w.text)} <a href="#m-${w.module}" style="font-size:.85rem">Open module</a></li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row" style="margin-top:12px"><a class="btn" href="#study-quiz-new">Take the What's new quiz</a><a class="btn ghost" href="#study-flash-new">What's new flashcards</a></div>
  <div class="section-h"><h2>Automatic comparison</h2></div><div id="diffBox" class="card"></div>
  <div class="section-h"><h2>How to add the next edition</h2></div>
  <div class="card"><ol><li>Copy <span class="mono">content/gina-${esc(CFG.activeEdition)}/</span> to a new folder (e.g. <span class="mono">content/gina-2027/</span>) and change the edition id inside the five files.</li>
  <li>Update the content from the new report, or give the new PDF and <span class="mono">content/SCHEMA.md</span> to Claude and ask it to regenerate the files.</li>
  <li>In <span class="mono">content/config.js</span>, add the edition and set <span class="mono">activeEdition</span>.</li>
  <li>This page will then list changed topics and tables, and the old edition stays available as an archive.</li></ol></div>`);
};
async function fillDiff(){
  const box=$("#diffBox"); if(!box) return;
  const ids=CFG.editions.map(e=>e.id).sort(); const i=ids.indexOf(S.edId);
  if(i<1){ box.innerHTML=`<p>Only one edition is installed, so there is nothing to compare yet. When ${esc(String(+S.edId+1))} is added, this panel will list topics added, removed or changed and which data tables (doses, criteria, algorithms) differ.</p>`; return; }
  try{ const A=mergeConsultant(await loadEdition(ids[i-1])); const d=diffEditions(A,S.E);
    box.innerHTML=`<p class="muted">Comparing ${esc(ids[i-1])} → ${esc(S.edId)}</p><div class="grid g2">
    <div><b>Topics added (${d.added.length})</b><ul>${d.added.map(x=>`<li>${esc(x)}</li>`).join("")||"<li class='muted'>None</li>"}</ul></div>
    <div><b>Topics changed (${d.changed.length})</b><ul>${d.changed.map(x=>`<li>${esc(x)}</li>`).join("")||"<li class='muted'>None</li>"}</ul></div>
    <div><b>Topics removed (${d.removed.length})</b><ul>${d.removed.map(x=>`<li>${esc(x)}</li>`).join("")||"<li class='muted'>None</li>"}</ul></div>
    <div><b>Data tables changed (${d.data.length})</b><ul>${d.data.map(x=>`<li class="mono">${esc(x)}</li>`).join("")||"<li class='muted'>None</li>"}</ul></div></div>`;
  }catch(err){ box.innerHTML=`<p>Could not load the previous edition: ${esc(err.message)}</p>`; }
}

async function render(){
  const r = location.hash.slice(1) || "home";
  const view = $("#view"); let html, after=null;
  if(r==="home") html=V.dash();
  else if(r==="learn") html=V.learn();
  else if(r.startsWith("m-")) html=V.module(r.slice(2));
  else if(r.startsWith("t-")) html=V.topic(r.slice(2));
  else if(r==="tools") html=V.tools();
  else if(r.startsWith("tool-")) html=V.tool(r.slice(5));
  else if(r==="patients") html=V.patients();
  else if(r.startsWith("patients-")) html=V.patients(r.slice(9));
  else if(r.startsWith("r-")){ const m=r.match(/^r-([A-Za-z0-9]+)-([a-z]+)$/); html = m?V.report(m[1],m[2]):V.dash(); }
  else if(r==="pbackup") html=V.pbackup();
  else if(r.startsWith("p-")) html=V.patient(r.slice(2));
  else if(r==="study") html=V.study();
  else if(r.startsWith("study-flash-")){ html=V.flash(); after=()=>runFlash(r.slice(12)); }
  else if(r.startsWith("study-quiz-")){ html=V.quiz(); after=()=>runQuiz(r.slice(11)); }
  else if(r==="study-cases") html=V.cases();
  else if(r.startsWith("study-case-")){ html=V.casePage(); after=()=>runCase(r.slice(11)); }
  else if(r==="updates"){ html=V.updates(); after=fillDiff; }
  else if(r==="search") html=V.search();
  else html=V.dash();
  view.innerHTML = `<div class="view">${html}</div>`;
  nav(); mountWidgets(view); if(after) after();
  if(!r.startsWith("search")) window.scrollTo(0,0);
}

document.addEventListener("click", e=>{
  const a=e.target.closest("[data-a]"), ed=e.target.closest("[data-ed]"), dv=e.target.closest("[data-del-visit]");
  const r = location.hash.slice(1);
  if(ed){ switchEdition(ed.dataset.ed); return; }
  if(dv && r.startsWith("p-")){ const ps=P.all(), p=ps.find(x=>x.id===r.slice(2)); const k=p.visits.findIndex(v=>v.date===dv.dataset.delVisit); if(k>=0){ p.visits.splice(k,1); P.save(ps); render(); toast("Visit removed"); } return; }
  if(!a) return;
  const act=a.dataset.a;
  if(act==="add"){ $("#addForm").hidden=false; $("#np_code").focus(); }
  else if(act==="cancel"){ $("#addForm").hidden=true; }
  else if(act==="save"){ const code=$("#np_code").value.trim(); if(!code){ $("#np_code").focus(); toast("Enter initials or an ID"); return; }
    const ps=P.all(); const p={id:uid(), code, age:$("#np_age").value, track:$("#np_track").value, dxConfirmed:$("#np_dx").value==="1", notes:"", visits:[]}; ps.unshift(p); P.save(ps); location.hash="p-"+p.id; toast("Patient saved"); }
  else if(act==="visit"){ $("#visitForm").hidden=false; $("#v_date").focus(); }
  else if(act==="cancelvisit"){ $("#visitForm").hidden=true; }
  else if(act==="savevisit"){ const ps=P.all(), p=ps.find(x=>x.id===r.slice(2)); saveVisit2(p); P.save(ps); render(); toast("Visit saved"); }
  else if(act==="edit"){ $("#editForm").hidden=false; }
  else if(act==="canceledit"){ $("#editForm").hidden=true; }
  else if(act==="saveedit"){ const ps=P.all(), p=ps.find(x=>x.id===r.slice(2)); const code=$("#pe_code").value.trim(); if(code) p.code=code; const bn=$("#pe_bio").value; p.biologic = bn?{name:bn,start:$("#pe_bios").value||today()}:null; p.ocsCourseMg=+$("#pe_ocsmg").value||200; p.dxConfirmed=$("#pe_dx").value==="1"; p.notes=$("#pe_notes").value; P.save(ps); render(); toast("Details saved"); }
  else if(act==="noticeok"){ store.set("notice_ok",true); const n=$("#noticeBox"); if(n) n.remove(); }
  else if(act==="del"){ $("#delConfirm").hidden=false; }
  else if(act==="delno"){ $("#delConfirm").hidden=true; }
  else if(act==="delyes"){ P.save(P.all().filter(x=>x.id!==r.slice(2))); location.hash="patients"; toast("Patient deleted"); }
  else if(act==="copybk"){ copyText($("#bk_out").value, $("#bk_out")); }
  else if(act==="restore"||act==="merge"){ const msg=$("#bk_msg");
    try{ const d=JSON.parse($("#bk_in").value); const arr=Array.isArray(d)?d:d.patients; if(!Array.isArray(arr)) throw new Error("No patient list found");
      arr.forEach(p=>{ if(!p.id||!p.code||!Array.isArray(p.visits)) throw new Error("A record is missing id, code or visits"); });
      if(act==="restore") P.save(arr); else { const cur=P.all(), ids=new Set(cur.map(p=>p.id)); P.save(cur.concat(arr.filter(p=>!ids.has(p.id)))); }
      msg.innerHTML=`<div class="callout good">${act==="restore"?"Restored":"Merged"} ${arr.length} patient record${arr.length!==1?"s":""}.</div>`;
    }catch(err){ msg.innerHTML=`<div class="callout bad">Could not read that backup: ${esc(err.message)}. Paste the full text that was copied from Export.</div>`; } }
});
document.addEventListener("change", e=>{
  if(e.target.id==="bk_file" && e.target.files[0]){ const fr=new FileReader(); fr.onload=()=>{ $("#bk_in").value=fr.result; }; fr.readAsText(e.target.files[0]); }
  if(e.target.matches(".chk input[type=checkbox]") && !e.target.closest(".widget")) e.target.closest(".chk").classList.toggle("on", e.target.checked);

  <p class="muted" style="font-size:.88rem">Developed by ${AUTHOR}. Not affiliated with or endorsed by the Global Initiative for Asthma.</p>
  <button class="btn" id="dOk" style="margin-top:8px">I understand</button></div>`;
  document.body.appendChild(bg); $("#dOk").focus();
  $("#dOk").addEventListener("click", ()=>{ store.set("disclaimer_ok", true); bg.remove(); });
}
